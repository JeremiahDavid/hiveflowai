# HiveFlow pipeline process registry
#
# AWS compute names follow (default):
#   {company}-{environment}-{connector}-{stage}-{slug}
#
# Processes may override with name_pattern (e.g. "{company}-{environment}-{slug}").
#
# EventBridge schedule rules:
#   {company}-{environment}-{connector}
#
# - stage: data lake layer (bronze, silver, gold)
# - slug:  short process name segment in the resource name
# - key:   stable identifier used in code (Process.INGEST, etc.)

naming:
  pattern: "{company}-{environment}-{connector}-{stage}-{slug}"
  connector_shared: all

stages:
  bronze:
    description: Raw ingest landing zone (append-only parquet runs)
  silver:
    description: Consolidated entity tables merged from bronze
  pipeline:
    description: Cross-layer connector refresh orchestration (bronze ingest through silver)
  gold:
    description: Published reconciliation snapshots and link tables (future)

processes:
  prepare:
    stage: bronze
    slug: prepare
    resource: lambda
    description: Resolve entity list and shared run_id for bronze Glue ingest
    connectors: [qbo, dbc]

  ingest:
    stage: bronze
    slug: ingest
    resource: glue_job
    description: >
      Pull source data into bronze via Glue Python Shell (sequential entity ingest per
      client connector).
    connectors: [qbo, dbc]

  qbd_ingest:
    stage: bronze
    slug: ingest
    resource: lambda
    description: QuickBooks Web Connector SOAP endpoint (QBWC polling).
    connectors: [qbd]

  finalize:
    stage: bronze
    slug: finalize
    resource: lambda
    description: Confirm manifest.json after Glue bronze ingest completes
    connectors: [qbo, dbc]

  refresh:
    stage: pipeline
    slug: refresh
    resource: step_function
    name_pattern: "{company}-{environment}-{connector}"
    description: >
      End-to-end connector refresh. QBO/DBC run bronze Glue ingest then silver
      consolidate; QBD runs silver consolidate only (ingest is QBWC-driven).
    connectors: [qbo, dbc, qbd]

  consolidate:
    stage: silver
    slug: silver-stg
    resource: glue_job
    name_pattern: "{company}-{environment}-{slug}"
    description: >
      Merge bronze parquet runs into silver_stg tables for all connectors via Glue
      Python Shell. DNA silver/gold SQL replay is a separate dna_apply Glue job.
    connectors: [all]

  dna_publish:
    stage: gold
    slug: dna-publish
    resource: lambda
    description: >
      Governance seed / init-client / compile-validate. Scheduled DNA refresh
      uses the dna_apply Glue job, not this Lambda.
    connectors: [all]

  dna_apply:
    stage: gold
    slug: dna
    resource: glue_job
    name_pattern: "{company}-{environment}-{slug}"
    description: >
      Copy silver_stg to silver, replay pinned silver SQL, then gold SQL (or
      Python compile fallback) via Glue Python Shell.
    connectors: [all]

  dna_refresh:
    stage: gold
    slug: dna
    resource: step_function
    name_pattern: "{company}-{environment}-{slug}"
    description: DNA silver + gold refresh orchestration (dna_apply Glue job)
    connectors: [all]

  ui_serve:
    stage: gold
    slug: ui-serve
    resource: lambda
    description: DNA reporting web UI (API Gateway + Lambda WSGI)
    connectors: [all]

  spreadsheet_engine:
    stage: gold
    slug: spreadsheet-engine
    resource: lambda
    description: >-
      Spreadsheet Engine — upload, extract, clean, and materialize Excel
      workbooks into silver/reference/ (web UI + async self-invoke worker;
      see infra/spreadsheet_engine.py)
    connectors: [all]

  # Reconciliation publish (future — cross-system links)
  # publish:
  #   stage: gold
  #   slug: publish
  #   resource: lambda
  #   description: Reconciliation publish job (bronze/silver → gold)
  #   connectors: [all]
