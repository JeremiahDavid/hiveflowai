[project]
name = "hiveflow-spreadsheet-parser"
version = "0.1.0"
description = "Agent that discovers, profiles, and extracts every structured table in a spreadsheet"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "hiveflow-core",
    "openpyxl>=3.1",
    "python-calamine>=0.2",
    "pandas>=2.2",
    "pydantic>=2.7",
    "PyYAML>=6.0",
]

[project.scripts]
hiveflow-parse = "hiveflow_spreadsheet_parser.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hiveflow_spreadsheet_parser"]
