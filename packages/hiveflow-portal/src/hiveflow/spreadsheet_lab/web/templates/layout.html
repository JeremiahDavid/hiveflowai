<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#F1EEE3">
  <title>{% block title %}Spreadsheet Engine{% endblock %} · hiveflowAI</title>
  <link rel="icon" href="/static/hiveflowai-logo-mono.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/static/theme.css">
  <script>
  (function () {
    try {
      var saved = window.localStorage.getItem("hiveflow-theme");
      if (saved === "light" || saved === "dark") {
        document.documentElement.setAttribute("data-theme", saved);
      }
    } catch (err) { /* ignore */ }
  })();
  </script>
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <div class="topbar-inner">
        <a class="brand" href="{{ portal_url }}">
          <img class="brand-icon-light" src="/static/hiveflowai-logo.svg" alt="hiveflowAI symbol" width="36" height="36">
          <img class="brand-icon-dark" src="/static/hiveflowai-logo-reversed.svg" alt="hiveflowAI symbol" width="36" height="36">
          <div class="brand-text">
            <div class="brand-name">hiveflow<span>AI</span></div>
            <div class="brand-tagline">Spreadsheet Engine</div>
          </div>
        </a>
        <div class="topbar-main">
          <div class="nav-actions">
            <nav class="nav" aria-label="Primary">
              <a class="nav-link" href="/">Jobs</a>
              <a class="nav-link" href="{{ portal_url }}">Portal</a>
            </nav>
            {% if username %}
            <span class="badge">{{ username }}</span>
            <a class="nav-link" href="{{ logout_url }}">Sign out</a>
            {% endif %}
            <button type="button" class="theme-toggle" id="themeToggle" aria-label="Switch to dark theme">
              <span class="theme-toggle-icon" aria-hidden="true">☾</span>
            </button>
          </div>
        </div>
      </div>
    </header>
    <main>
      <div class="portal-content">{% block content %}{% endblock %}</div>
    </main>
    <footer class="footer">
      <span>Spreadsheet Engine</span>
      <span>Powered by HiveFlow DNA</span>
    </footer>
  </div>
  <script>
  (function () {
    var STORAGE_KEY = "hiveflow-theme";
    var root = document.documentElement;
    var toggle = document.getElementById("themeToggle");
    if (!toggle) return;

    var media = window.matchMedia ? window.matchMedia("(prefers-color-scheme: dark)") : null;

    function systemPrefersDark() {
      return !!(media && media.matches);
    }

    function currentTheme() {
      var explicit = root.getAttribute("data-theme");
      if (explicit === "light" || explicit === "dark") return explicit;
      return systemPrefersDark() ? "dark" : "light";
    }

    function syncChrome(theme) {
      toggle.setAttribute(
        "aria-label",
        theme === "dark" ? "Switch to light theme" : "Switch to dark theme"
      );
      var icon = toggle.querySelector(".theme-toggle-icon");
      if (icon) icon.textContent = theme === "dark" ? "☀" : "☾";
      var meta = document.querySelector('meta[name="theme-color"]');
      if (meta) meta.setAttribute("content", theme === "dark" ? "#17150F" : "#F1EEE3");
    }

    syncChrome(currentTheme());
    if (media && media.addEventListener) {
      media.addEventListener("change", function () {
        if (!root.getAttribute("data-theme")) syncChrome(currentTheme());
      });
    }

    toggle.addEventListener("click", function () {
      var next = currentTheme() === "dark" ? "light" : "dark";
      root.setAttribute("data-theme", next);
      syncChrome(next);
      try {
        window.localStorage.setItem(STORAGE_KEY, next);
      } catch (err) { /* ignore */ }
    });
  })();
  </script>
</body>
</html>
