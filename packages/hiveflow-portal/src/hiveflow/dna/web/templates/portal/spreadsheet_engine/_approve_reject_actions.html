
        <div class="{{ wrap_class }}">
          <div class="spreadsheet-transform-action-btns">
            {% if approve_action %}
            <form method="post" class="assistant-approve-form">
              <input type="hidden" name="action" value="{{ approve_action }}" />
              <input type="hidden" name="job_id" value="{{ job_id }}" />
              <input type="hidden" name="table_id" value="{{ table_id }}" />
              <input type="hidden" name="table_index" value="{{ table_index }}" />
              <button type="submit" class="btn btn-primary">{{ approve_label }}</button>
            </form>
            {% endif %}
            <form method="post" class="spreadsheet-transform-reject-form">
              <input type="hidden" name="action" value="{{ reject_action }}" />
              <input type="hidden" name="job_id" value="{{ job_id }}" />
              <input type="hidden" name="table_id" value="{{ table_id }}" />
              <input type="hidden" name="table_index" value="{{ table_index }}" />
              <div class="spreadsheet-reject-box">
                <div class="spreadsheet-reject-compose">
                  <textarea id="{{ reason_field_id }}" name="reason" rows="4" class="spreadsheet-transform-reason"
                    aria-label="Reject details"
                    placeholder="{{ reject_placeholder }}"></textarea>
                  <button type="submit" class="btn btn-secondary spreadsheet-reject-submit">{{ reject_label }}</button>
                </div>
              </div>
            </form>
          </div>
        </div>
