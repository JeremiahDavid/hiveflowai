<div class="grid">
  {% for pack_id in available %}
  <div class="card">
    <h3>{{ pack_id | title }}</h3>
    <form method="post" action="{{ action_url }}">
      <input type="hidden" name="action" value="init" />
      <input type="hidden" name="industry_pack_id" value="{{ pack_id }}" />
      <button type="submit" class="btn btn-primary">Initialize mapping</button>
    </form>
  </div>
  {% endfor %}
</div>
