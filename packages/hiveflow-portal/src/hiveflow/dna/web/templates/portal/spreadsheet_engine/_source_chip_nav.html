<nav class="{{ nav_class }}" aria-label="{{ aria_label }}">{% for chip in chips %}<span class="source-docs-source-chip spreadsheet-table-chip{% if chip.active %} is-active{% endif %}"><a class="spreadsheet-table-chip-link" href="{{ chip.href }}">{{ chip.name }}{% if chip.badge %}<span class="source-docs-source-badge{% if not chip.done %} is-empty{% endif %}">{{ chip.badge }}</span>{% endif %}</a>{% if chip.can_reject %}<form method="post" class="spreadsheet-table-chip-reject" onsubmit="return window.confirm('Reject {{ chip.name }}? This removes it from the review set.');"><input type="hidden" name="action" value="reject_table" /><input type="hidden" name="job_id" value="{{ chip.job_id }}" /><input type="hidden" name="table_id" value="{{ chip.table_id }}" /><input type="hidden" name="table_index" value="{{ chip.table_index }}" /><button type="submit" class="spreadsheet-table-chip-reject-btn" title="Reject {{ chip.name }}" aria-label="Reject {{ chip.name }}" formnovalidate>&times;</button></form>{% endif %}</span>{% endfor %}</nav>
