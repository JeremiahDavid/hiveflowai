[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hiveflow-portal"
version = "0.1.0"
description = "HiveFlow portal UI, reporting surfaces, and Cognito auth"
requires-python = ">=3.11"
dependencies = [
    "boto3>=1.35.0",
    "pyyaml>=6.0.0",
    "pyarrow>=18.0.0",
    "fastapi>=0.115",
    "mangum>=0.17",
    "a2wsgi>=1.10",
    "uvicorn>=0.30",
    "werkzeug>=3.1.0",  # still used by the mounted WSGI app during the incremental FastAPI migration
    "httpx>=0.28.0",
    "python-dotenv>=1.0.0",
    "jinja2>=3.1.0",
]

[tool.setuptools.packages.find]
where = ["src"]
namespaces = true

[tool.setuptools.package-data]
"hiveflow.dna.web" = ["static/*", "charts/*.yaml", "templates/**/*.html"]
"hiveflow.dna.web.admin.onboarding.guides" = ["*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
