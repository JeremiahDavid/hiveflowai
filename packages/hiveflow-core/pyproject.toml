[project]
name = "hiveflow-core"
version = "0.1.0"
description = "Shared runtime for HiveFlow agentic components: Bedrock wiring, agent loop, data contracts"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "claude-agent-sdk>=0.1.0",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hiveflow_core"]
