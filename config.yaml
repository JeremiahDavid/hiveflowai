default:
  company: poc
  environment: dev
secrets:
  secret_name_template: hiveflow-{company}-{source}-{environment}
  data_bucket_name_template: meshflow-{company}-{account}-{region}
  athena_results_bucket_name_template: athena-results-{company}-{account}-{region}
  glue_database_name_template: meshflow_{company}_{environment}
platform:
  environments:
    dev:
      aws:
        region: us-east-2
      ui:
        enabled: true
        portal:
          default_client_id: poc
          default_max_users: 10
          config_assistant:
            monthly_budget_usd: 10
          dna_manual_refresh:
            monthly_limit: 10
          email:
            enabled: true
            from_address: noreply@hive-flow-ai.com
            from_name: HiveFlowAI
          clients:
            poc:
              display_name: POC Distribution Co.
              reporting_company: poc
              reporting_hostname: poc
              max_users: 10
              welcome_title: Your operational dashboard
              welcome_message: 'Certified Business Central metrics from your governed
                semantic layer.

                '
              accent_color: '#14b8a6'
            poc2:
              display_name: POC 2
              reporting_company: poc2
              reporting_hostname: poc2
              welcome_title: Your operational dashboard
        spreadsheet_engine:
          # Subdomain for the Spreadsheet Engine UI (part of
          # GlobalAgentPipelinesStack — see infra/spreadsheet_engine.py).
          # Auth is the real portal's session cookie, not a separate secret.
          hostname: spreadsheet-engine
        domain:
          zone_name: hive-flow-ai.com
          primary_hostname: hive-flow-ai.com
          alternate_hostnames:
          - www
          admin_hostname: admin
          manage_dns: false
          hosted_zone_id: Z0833907O664KG7NO3CQ
          create_hosted_zone: false
companies:
  poc:
    stack_name_company: POC
    environments:
      dev:
        aws:
          region: us-east-2
        qbo:
          tier: sandbox
          entity_bundle: full_accounting
          schedule:
            hour: 6
            minute: 0
        qbd:
          entity_bundle: full_accounting
        dbc:
          entity_bundle: full
          schedule:
            hour: 6
            minute: 30
        dna:
          enabled: true
          source: dbc
          schedule:
            hour: 7
            minute: 0
      prod:
        aws:
          region: us-east-2
          account: REPLACE_WITH_PROD_ACCOUNT_ID
        qbo:
          tier: production
          entity_bundle: full_accounting
          schedule:
            hour: 6
            minute: 0
  poc2:
    stack_name_company: POC2
    environments:
      dev:
        aws:
          region: us-east-2
        dbc:
          entity_bundle: full
          schedule:
            hour: 6
            minute: 0
        dna:
          enabled: true
          source: dbc
