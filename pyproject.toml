[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hiveflow-workspace"
version = "0.1.0"
description = "HiveFlow monorepo workspace (install packages/* for the product)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = [
    "aws-cdk-lib>=2.170.0",
    "constructs>=10.0.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
]

[tool.setuptools]
packages = []

[tool.pytest.ini_options]
testpaths = [
    "tests",
    "packages/hiveflow-platform/tests",
    "packages/hiveflow-core/tests",
    "packages/hiveflow-spreadsheet-parser/tests",
    "packages/hiveflow-connectors/tests",
    "packages/hiveflow-lake/tests",
    "packages/hiveflow-dna/tests",
    "packages/hiveflow-portal/tests",
]
norecursedirs = ["cdk.out", ".git", ".venv", "node_modules"]
asyncio_mode = "auto"
markers = [
    "bedrock: test makes a live Amazon Bedrock call (needs AWS creds; skipped in CI)",
]
